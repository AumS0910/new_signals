name: Zee Business daily signals

on:
  schedule:
    # Poll every five minutes on weekdays; the script itself limits writes to
    # 09:15-15:30 IST and exits harmlessly outside that window.
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests openpyxl
      - run: python daily_signal_sync.py
      - name: Save updated Excel
        run: |
          git config user.name "zee-business-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add zeebiz_live_stocks.xlsx
          git diff --cached --quiet || git commit -m "Update daily Zee Business signals"
          git push
